<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#E61A27" />
  <title>Coca-Cola · Imprime tu lámina</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --red: #E61A27;
      --red-dark: #C20E1A;
      --red-deep: #8E0C14;
      --ink: #161616;
      --line: rgba(255,255,255,.16);
      --panel: rgba(0,0,0,.14);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      color: #fff;
      background: var(--red);
      min-height: 100dvh;
      display: flex; align-items: center; justify-content: center;
      padding: 24px;
    }

    .card {
      width: 100%; max-width: 430px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 18px;
      box-shadow: 0 24px 60px rgba(0,0,0,.30);
      padding: 34px 28px 26px;
    }

    .logo { display: block; height: 34px; width: auto; margin: 0 auto 26px;
      filter: brightness(0) invert(1); }

    .eyebrow {
      text-align: center; font-family: 'Oswald', sans-serif; font-weight: 500;
      font-size: 12px; letter-spacing: 4px; text-transform: uppercase;
      color: rgba(255,255,255,.72); margin-bottom: 10px;
    }
    h1 {
      text-align: center; font-family: 'Oswald', sans-serif; font-weight: 700;
      font-size: 34px; line-height: 1.04; text-transform: uppercase; letter-spacing: .5px;
      margin-bottom: 12px;
    }
    .subtitle {
      text-align: center; font-size: 14.5px; line-height: 1.5; color: rgba(255,255,255,.82);
      margin-bottom: 26px; padding: 0 4px;
    }

    .divider { width: 46px; height: 3px; background: #fff; border-radius: 2px; margin: 0 auto 22px; opacity: .9; }

    .frame {
      position: relative; cursor: pointer;
      border: 1.5px dashed rgba(255,255,255,.45);
      border-radius: 14px; padding: 34px 18px; text-align: center;
      background: rgba(255,255,255,.05);
      transition: border-color .2s ease, background .2s ease;
    }
    .frame.dragover { border-color: #fff; background: rgba(255,255,255,.12); }
    .frame .ic { width: 40px; height: 40px; margin: 0 auto 14px; display: block; opacity: .92; }
    .frame .big { font-family: 'Oswald', sans-serif; font-weight: 600; font-size: 16px; letter-spacing: .5px; text-transform: uppercase; }
    .frame .small { font-size: 12.5px; color: rgba(255,255,255,.7); margin-top: 5px; }

    .preview-wrap { display: none; }
    .preview-wrap.show { display: block; }
    .sticker {
      border-radius: 10px; overflow: hidden; border: 3px solid #fff;
      box-shadow: 0 10px 24px rgba(0,0,0,.35); background: #000;
      aspect-ratio: 5 / 7; max-height: 340px; margin: 0 auto;
    }
    .sticker img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .filename { font-size: 12px; color: rgba(255,255,255,.72); margin-top: 10px; text-align: center; word-break: break-all; }

    .btn {
      width: 100%; border: none; cursor: pointer; font-family: 'Oswald', sans-serif;
      font-weight: 600; font-size: 16px; letter-spacing: 1px; text-transform: uppercase;
      border-radius: 11px; padding: 16px; transition: transform .12s ease, opacity .2s ease;
    }
    .btn:disabled { opacity: .45; cursor: not-allowed; }
    .btn-primary { margin-top: 18px; background: #fff; color: var(--red); }
    .btn-primary:not(:disabled):active { transform: translateY(2px); }
    .btn-ghost { margin-top: 10px; background: transparent; color: #fff; border: 1.5px solid rgba(255,255,255,.5); font-size: 13px; letter-spacing: .5px; padding: 12px; }

    .progress { display: none; margin-top: 18px; }
    .progress.show { display: block; }
    .bar { height: 6px; background: rgba(255,255,255,.22); border-radius: 999px; overflow: hidden; }
    .bar > i { display: block; height: 100%; width: 0%; background: #fff; transition: width .3s ease; }
    .progress small { display: block; margin-top: 9px; font-size: 12.5px; color: rgba(255,255,255,.82); text-align: center; letter-spacing: .3px; }

    .success { display: none; text-align: center; }
    .success.show { display: block; }
    .success .mark { width: 60px; height: 60px; margin: 4px auto 18px; border: 2px solid #fff; border-radius: 50%;
      display: flex; align-items: center; justify-content: center; }
    .success .mark svg { width: 30px; height: 30px; }
    .success h2 { font-family: 'Oswald', sans-serif; font-weight: 700; font-size: 28px; text-transform: uppercase; letter-spacing: .5px; margin-bottom: 8px; }
    .success p { font-size: 14.5px; color: rgba(255,255,255,.82); line-height: 1.5; margin-bottom: 20px; }

    .error-msg { display: none; margin-top: 14px; background: rgba(0,0,0,.28); border: 1px solid var(--line);
      border-radius: 10px; padding: 12px; font-size: 13px; line-height: 1.45; }
    .error-msg.show { display: block; }

    .footer { margin-top: 24px; text-align: center; font-family: 'Oswald', sans-serif; font-weight: 500;
      font-size: 11px; letter-spacing: 3px; text-transform: uppercase; color: rgba(255,255,255,.55); }

    input[type=file] { display: none; }

    @media (max-width: 380px) { h1 { font-size: 29px; } .card { padding: 28px 20px; } }
  </style>
</head>
<body>
  <main class="card">
    <!-- PASO 1 -->
    <section id="step-upload">
      <img class="logo" src="logo-cocacola.png" alt="Coca-Cola" />
      <div class="eyebrow">Tu lámina coleccionable</div>
      <h1>Imprime tu lámina</h1>
      <div class="divider"></div>
      <p class="subtitle">Sube la foto de tu lámina y nuestro equipo la imprimirá para ti en segundos.</p>

      <div class="frame" id="dropzone">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 16V4m0 0L7 9m5-5 5 5"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/>
        </svg>
        <div class="big">Toca para subir tu foto</div>
        <div class="small">o arrástrala aquí — JPG o PNG</div>
      </div>

      <div class="preview-wrap" id="previewWrap">
        <div class="sticker"><img id="previewImg" alt="Vista previa" /></div>
        <p class="filename" id="fileName"></p>
      </div>

      <button class="btn btn-primary" id="sendBtn" disabled>Enviar a impresión</button>
      <button class="btn btn-ghost" id="changeBtn" style="display:none">Elegir otra foto</button>

      <div class="progress" id="progress">
        <div class="bar"><i id="barFill"></i></div>
        <small id="progressText">Enviando tu lámina…</small>
      </div>

      <div class="error-msg" id="errorMsg"></div>
      <input type="file" id="fileInput" accept="image/*" />
    </section>

    <!-- PASO 2 -->
    <section id="step-success" class="success">
      <img class="logo" src="logo-cocacola.png" alt="Coca-Cola" />
      <div class="mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg>
      </div>
      <h2>Foto recibida</h2>
      <p>Tu lámina fue enviada a impresión. En unos instantes la tendrás lista.</p>
      <button class="btn btn-primary" id="againBtn">Subir otra foto</button>
    </section>

  </main>

  <script>
    // ============================================================
    //  CONFIGURACIÓN — URL del Apps Script Web App
    // ============================================================
    const UPLOAD_URL = "https://script.google.com/macros/s/AKfycbydi_P4E_tQz-SWlr-SS9nKgXiLAMBMc4uXRE7UHrrBvNUfK0uNPVDj1f65_-97RY1HmA/exec";
    const MAX_MB = 20;

    const fileInput = document.getElementById('fileInput');
    const dropzone = document.getElementById('dropzone');
    const previewWrap = document.getElementById('previewWrap');
    const previewImg = document.getElementById('previewImg');
    const fileName = document.getElementById('fileName');
    const sendBtn = document.getElementById('sendBtn');
    const changeBtn = document.getElementById('changeBtn');
    const progress = document.getElementById('progress');
    const barFill = document.getElementById('barFill');
    const progressText = document.getElementById('progressText');
    const errorMsg = document.getElementById('errorMsg');
    const stepUpload = document.getElementById('step-upload');
    const stepSuccess = document.getElementById('step-success');
    const againBtn = document.getElementById('againBtn');

    let selectedFile = null;

    dropzone.addEventListener('click', () => fileInput.click());
    changeBtn.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', (e) => handleFile(e.target.files[0]));

    ['dragenter', 'dragover'].forEach(ev =>
      dropzone.addEventListener(ev, e => { e.preventDefault(); dropzone.classList.add('dragover'); }));
    ['dragleave', 'drop'].forEach(ev =>
      dropzone.addEventListener(ev, e => { e.preventDefault(); dropzone.classList.remove('dragover'); }));
    dropzone.addEventListener('drop', e => handleFile(e.dataTransfer.files[0]));

    function handleFile(file) {
      hideError();
      if (!file) return;
      if (!file.type.startsWith('image/')) { showError('Por favor sube una imagen (JPG o PNG).'); return; }
      if (file.size > MAX_MB * 1024 * 1024) { showError('La imagen supera ' + MAX_MB + ' MB. Intenta con una más liviana.'); return; }

      selectedFile = file;
      const reader = new FileReader();
      reader.onload = (e) => {
        previewImg.src = e.target.result;
        previewWrap.classList.add('show');
        dropzone.style.display = 'none';
        changeBtn.style.display = 'block';
        fileName.textContent = file.name;
        sendBtn.disabled = false;
      };
      reader.readAsDataURL(file);
    }

    sendBtn.addEventListener('click', uploadFile);

    function uploadFile() {
      if (!selectedFile) return;
      hideError();
      sendBtn.disabled = true;
      changeBtn.style.display = 'none';
      progress.classList.add('show');
      fakeProgress(0);

      const reader = new FileReader();
      reader.onload = async () => {
        const base64 = reader.result.split(',')[1];
        const payload = { filename: buildName(selectedFile.name), mimeType: selectedFile.type, data: base64 };
        try {
          const res = await fetch(UPLOAD_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify(payload)
          });
          const out = await res.json();
          if (out.status === 'ok') {
            barFill.style.width = '100%';
            progressText.textContent = 'Envío completo';
            setTimeout(showSuccess, 600);
          } else { throw new Error(out.message || 'Respuesta inesperada del servidor.'); }
        } catch (err) {
          progress.classList.remove('show');
          sendBtn.disabled = false;
          changeBtn.style.display = 'block';
          showError('No pudimos enviar la foto. Revisa tu conexión e inténtalo de nuevo.');
        }
      };
      reader.readAsDataURL(selectedFile);
    }

    function buildName(original) {
      const ext = (original.split('.').pop() || 'jpg').toLowerCase();
      const d = new Date();
      const ts = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' +
        String(d.getDate()).padStart(2, '0') + '_' + String(d.getHours()).padStart(2, '0') +
        String(d.getMinutes()).padStart(2, '0') + String(d.getSeconds()).padStart(2, '0');
      const rand = Math.random().toString(36).slice(2, 6);
      return 'CocaCola_' + ts + '_' + rand + '.' + ext;
    }

    function fakeProgress(p) {
      barFill.style.width = p + '%';
      if (p < 90) setTimeout(() => fakeProgress(p + Math.random() * 18), 250);
    }

    function showSuccess() { stepUpload.style.display = 'none'; stepSuccess.classList.add('show'); }

    againBtn.addEventListener('click', () => {
      selectedFile = null; fileInput.value = ''; previewImg.src = '';
      previewWrap.classList.remove('show'); dropzone.style.display = 'block';
      changeBtn.style.display = 'none'; progress.classList.remove('show');
      barFill.style.width = '0%'; progressText.textContent = 'Enviando tu lámina…';
      sendBtn.disabled = true; stepSuccess.classList.remove('show'); stepUpload.style.display = 'block';
    });

    function showError(msg) { errorMsg.textContent = msg; errorMsg.classList.add('show'); }
    function hideError() { errorMsg.classList.remove('show'); }
  </script>
</body>
</html>
