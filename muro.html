<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#E61A27" />
  <title>Coca-Cola · Muro de láminas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --red: #E61A27;
      --red-dark: #C20E1A;
      --red-deep: #8E0C14;
      --line: rgba(255,255,255,.16);
      --panel: rgba(0,0,0,.16);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: 'Inter', system-ui, sans-serif; color: #fff;
      background: var(--red);
      height: 100dvh; overflow: hidden;
    }

    .stage {
      position: relative; z-index: 1;
      height: 100dvh; width: 100%;
      display: flex; flex-direction: column;
      padding: clamp(22px, 3.4vh, 52px) clamp(22px, 3.2vw, 56px);
      gap: clamp(16px, 2.4vh, 34px);
    }


    /* ===== Header ===== */
    .top { display: flex; align-items: flex-start; justify-content: space-between;
      gap: clamp(16px, 3vw, 40px); flex-shrink: 0; }
    .brand-block { padding-top: 6px; min-width: 0; flex: 1 1 auto; }
    .logo { height: clamp(32px, 5vh, 66px); max-width: 100%; width: auto; filter: brightness(0) invert(1); display: block; }
    .eyebrow { font-family: 'Oswald', sans-serif; font-weight: 700; text-transform: uppercase;
      letter-spacing: clamp(2px, .4vw, 5px); font-size: clamp(14px, 1.9vh, 24px); line-height: 1.2;
      color: #fff; margin-top: clamp(14px, 2vh, 26px); }

    .qr-block { flex: 0 0 auto; text-align: center; width: min(34vw, 230px); }
    .qr-card { background: #fff; padding: clamp(8px,1.2vw,15px); border-radius: 12px; box-shadow: 0 14px 32px rgba(0,0,0,.3); }
    .qr-card img { display: block; width: 100%; height: auto; aspect-ratio: 1 / 1; }
    .qr-block .scan { font-family: 'Oswald', sans-serif; font-weight: 500; text-transform: uppercase;
      letter-spacing: 1.5px; font-size: clamp(11px, 1.4vh, 16px); line-height: 1.35;
      color: rgba(255,255,255,.9); margin-top: 12px; white-space: normal; }

    /* ===== Barra título + contador ===== */
    .bar { display: flex; align-items: flex-end; justify-content: space-between; gap: 18px; flex-shrink: 0;
      border-bottom: 1px solid var(--line); padding-bottom: clamp(10px,1.4vh,18px); }
    .bar h2 { font-family: 'Oswald', sans-serif; font-weight: 700; text-transform: uppercase;
      letter-spacing: 1px; font-size: clamp(22px, 3.2vh, 46px); }
    .count { text-align: right; line-height: 1; }
    .count .n { font-family: 'Oswald', sans-serif; font-weight: 700; font-size: clamp(26px, 4vh, 58px); }
    .count .l { font-family: 'Oswald', sans-serif; font-weight: 500; text-transform: uppercase;
      letter-spacing: 2px; font-size: clamp(10px, 1.3vh, 15px); color: rgba(255,255,255,.7); margin-top: 4px; }

    /* ===== Grid (últimas 8) ===== */
    .grid { flex: 1; min-height: 0; display: grid;
      grid-template-columns: repeat(2, 1fr); grid-template-rows: repeat(2, 1fr);
      gap: clamp(16px, 2.6vh, 38px); justify-items: center; align-items: center; }
    .sticker {
      position: relative; aspect-ratio: 5 / 7; width: 100%;
      border-radius: 8px; overflow: hidden; cursor: pointer;
      border: clamp(3px,.5vh,5px) solid #fff; background: rgba(0,0,0,.22);
      box-shadow: 0 10px 24px rgba(0,0,0,.30);
      transition: transform .18s ease, box-shadow .2s ease;
      animation: fade .5s ease both;
    }
    .grid .sticker { height: 100%; width: auto; max-width: 100%; margin: 0 auto; }
    @keyframes fade { from { opacity: 0; transform: translateY(16px) scale(.98); } }
    .sticker:hover { transform: translateY(-4px); box-shadow: 0 16px 34px rgba(0,0,0,.45); }
    .sticker:active { transform: scale(.98); }
    .sticker img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .sticker.fresh { border-color: #fff;
      box-shadow: 0 0 0 3px rgba(255,255,255,.6), 0 14px 30px rgba(0,0,0,.4);
      animation: popIn .8s cubic-bezier(.2,.8,.3,1.35) both; }
    @keyframes popIn { 0% { opacity: 0; transform: scale(.72); } 60% { transform: scale(1.05); } 100% { transform: scale(1); } }
    .sticker .new-flag { position: absolute; top: 0; left: 0; background: #fff; color: var(--red);
      font-family: 'Oswald', sans-serif; font-weight: 700; text-transform: uppercase; letter-spacing: 1.5px;
      font-size: clamp(9px,1.2vh,13px); padding: 4px 10px; border-radius: 0 0 8px 0; }

    .empty { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
      color: rgba(255,255,255,.85); text-align: center; }
    .empty .t { font-family: 'Oswald', sans-serif; font-weight: 600; text-transform: uppercase;
      letter-spacing: 1px; font-size: clamp(20px, 3vh, 34px); }
    .empty p { font-size: clamp(14px, 2vh, 20px); color: rgba(255,255,255,.7); margin-top: 8px; }

    /* ===== Botón galería ===== */
    .footer-bar { flex-shrink: 0; display: flex; justify-content: center; }
    .btn-gallery { border: none; cursor: pointer; background: #fff; color: var(--red);
      font-family: 'Oswald', sans-serif; font-weight: 600; text-transform: uppercase; letter-spacing: 1.5px;
      font-size: clamp(14px, 1.9vh, 22px); padding: clamp(13px,1.8vh,20px) clamp(30px,4.5vw,56px);
      border-radius: 10px; box-shadow: 0 10px 24px rgba(0,0,0,.28); transition: transform .12s ease; }
    .btn-gallery:active { transform: translateY(2px); }

    /* ===== Modales ===== */
    .overlay { position: fixed; inset: 0; z-index: 10; background: rgba(40,2,4,.82);
      backdrop-filter: blur(4px); display: none; align-items: center; justify-content: center; padding: 28px; }
    .overlay.show { display: flex; }
    /* El lightbox de la foto debe quedar SOBRE la galería */
    #lightbox { z-index: 30; }

    .light-card { width: min(92vw, 600px); max-height: 92dvh; display: flex; flex-direction: column;
      background: #fff; border-radius: 14px; overflow: hidden; box-shadow: 0 24px 60px rgba(0,0,0,.5); }
    .light-card .pic { background: #111; flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; }
    .light-card .pic img { width: 100%; height: 100%; max-height: 66dvh; object-fit: contain; display: block; }
    .light-actions { display: flex; gap: 10px; padding: 14px; }
    .light-actions button { flex: 1; border: none; cursor: pointer; font-family: 'Oswald', sans-serif;
      font-weight: 600; text-transform: uppercase; letter-spacing: 1px; font-size: 15px; padding: 15px; border-radius: 9px; }
    .btn-print { background: var(--red); color: #fff; }
    .btn-print:active { transform: translateY(2px); }
    .btn-close { background: #ececec; color: #333; flex: 0 0 auto; padding-left: 24px; padding-right: 24px; }
    .btn-delete { background: #fff; color: #b00020; border: 1.5px solid #b00020 !important; flex: 0 0 auto; padding-left: 20px; padding-right: 20px; }
    .btn-delete[disabled], .btn-print[disabled] { opacity: .5; cursor: not-allowed; }

    .gallery-card { width: min(96vw, 1600px); height: 92dvh; background: var(--panel);
      border: 1px solid var(--line); border-radius: 14px; display: flex; flex-direction: column; overflow: hidden; }
    .gallery-head { display: flex; align-items: center; justify-content: space-between; padding: clamp(16px,2vh,24px) clamp(20px,2.5vw,30px);
      background: rgba(0,0,0,.28); flex-shrink: 0; }
    .gallery-head h3 { font-family: 'Oswald', sans-serif; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; font-size: clamp(18px,2.4vh,26px); }
    .gallery-head .close-x { cursor: pointer; background: #fff; color: var(--red); border: none;
      width: clamp(38px,5vh,48px); height: clamp(38px,5vh,48px); border-radius: 8px; font-size: 20px; font-weight: 700; line-height: 1; }
    .gallery-grid { overflow-y: auto; padding: clamp(16px,2vh,26px); display: grid; align-content: start;
      gap: clamp(10px, 1.4vw, 18px);
      grid-template-columns: repeat(auto-fill, minmax(clamp(105px, 11vw, 168px), 1fr)); }
    .gallery-grid .sticker { aspect-ratio: 5/7; animation: none; border-width: 3px; }
    .gallery-grid .sticker:hover { transform: scale(1.05); box-shadow: 0 12px 26px rgba(0,0,0,.5); }

    .toast { position: fixed; bottom: 32px; left: 50%; transform: translateX(-50%) translateY(140px); z-index: 20;
      background: #fff; color: var(--red); font-family: 'Oswald', sans-serif; font-weight: 600; text-transform: uppercase;
      letter-spacing: 1px; font-size: clamp(14px, 1.9vh, 19px); padding: 14px 30px; border-radius: 10px;
      box-shadow: 0 14px 30px rgba(0,0,0,.4); transition: transform .4s cubic-bezier(.2,.8,.3,1.2); }
    .toast.show { transform: translateX(-50%) translateY(0); }

    /* Impresión: solo la foto, a página completa */
    #print-area { display: none; }
    @media print {
      body * { visibility: hidden !important; }
      #print-area, #print-area * { visibility: visible !important; }
      #print-area { display: block !important; position: fixed; inset: 0; }
      #print-area img { width: 100%; height: 100%; object-fit: contain; }
      @page { margin: 0; }
    }

    /* Pantallas horizontales: 4 en una fila */
    @media (min-aspect-ratio: 1/1) {
      .grid { grid-template-columns: repeat(4, 1fr); grid-template-rows: 1fr; }
    }
  </style>
</head>
<body>
  <div class="stage">
    <header class="top">
      <div class="brand-block">
        <img class="logo" src="logo-cocacola.png" alt="Coca-Cola" />
        <div class="eyebrow"><strong>¡Tu lámina está casi lista!</strong></div>
      </div>
      <div class="qr-block">
        <div class="qr-card"><img id="qr" alt="Escanea para subir tu foto" /></div>
        <div class="scan">Escanea el código para imprimir tu lámina</div>
      </div>
    </header>

    <div class="bar">
      <h2>Últimas láminas</h2>
      <div class="count"><div class="n" id="count">0</div><div class="l">Láminas registradas</div></div>
    </div>

    <div class="grid" id="grid"></div>
    <div class="empty" id="empty" style="display:none">
      <div class="t">Aún no hay láminas</div>
      <p>Escanea el código para subir la primera.</p>
    </div>

    <div class="footer-bar">
      <button class="btn-gallery" id="openGallery">Ver galería completa (<span id="totalBtn">0</span>)</button>
    </div>
  </div>

  <!-- LIGHTBOX -->
  <div class="overlay" id="lightbox">
    <div class="light-card">
      <div class="pic"><img id="lightImg" alt="Lámina" /></div>
      <div class="light-actions">
        <button class="btn-close" id="lightClose">Cerrar</button>
        <button class="btn-delete" id="lightDelete">Eliminar</button>
        <button class="btn-print" id="lightPrint">Imprimir</button>
      </div>
    </div>
  </div>

  <!-- GALERÍA COMPLETA -->
  <div class="overlay" id="gallery">
    <div class="gallery-card">
      <div class="gallery-head">
        <h3>Galería completa · <span id="galleryCount">0</span> láminas</h3>
        <button class="close-x" id="galleryClose">✕</button>
      </div>
      <div class="gallery-grid" id="galleryGrid"></div>
    </div>
  </div>

  <div class="toast" id="toast">Nueva lámina recibida</div>

  <div id="print-area"><img id="printImg" alt="" /></div>

  <script>
    // ============================================================
    //  CONFIGURACIÓN
    // ============================================================
    const LANDING_URL = "https://coca-cola-x-kuva.vercel.app";
    const API_URL = "https://script.google.com/macros/s/AKfycbydi_P4E_tQz-SWlr-SS9nKgXiLAMBMc4uXRE7UHrrBvNUfK0uNPVDj1f65_-97RY1HmA/exec";
    const REFRESH_SECONDS = 8;
    const SHOWN = 4;

    document.getElementById('qr').src =
      "https://api.qrserver.com/v1/create-qr-code/?size=300x300&margin=8&data=" + encodeURIComponent(LANDING_URL);

    const grid = document.getElementById('grid');
    const empty = document.getElementById('empty');
    const countEl = document.getElementById('count');
    const totalBtn = document.getElementById('totalBtn');
    const toast = document.getElementById('toast');
    const lightbox = document.getElementById('lightbox');
    const lightImg = document.getElementById('lightImg');
    const printImg = document.getElementById('printImg');
    const gallery = document.getElementById('gallery');
    const galleryGrid = document.getElementById('galleryGrid');
    const galleryCount = document.getElementById('galleryCount');

    let allFiles = [];
    let knownIds = new Set();
    let firstLoad = true;
    let seq = 0;
    let lastSig = null;

    // ---- Polling JSONP (ligero: solo metadatos) ----
    function poll() {
      const cbName = '__cb_' + (seq++);
      const s = document.createElement('script');
      function cleanup(){ delete window[cbName]; if (s.parentNode) s.parentNode.removeChild(s); }
      window[cbName] = function (data) { try { onData(data); } finally { cleanup(); } };
      s.onerror = cleanup;
      s.src = API_URL + '?action=list&callback=' + cbName + '&t=' + Date.now();
      document.body.appendChild(s);
    }

    function onData(data) {
      if (!data || data.status !== 'ok') return;
      const files = data.files || [];
      const sig = files.map(f => f.id).join(',');

      // si la lista no cambió, no repintamos (evita parpadeo y recargas)
      if (sig === lastSig && !firstLoad) return;

      allFiles = files;
      let newCount = 0;
      if (!firstLoad) allFiles.forEach(f => { if (!knownIds.has(f.id)) newCount++; });
      paint(!firstLoad);
      if (newCount > 0) showToast(newCount);
      knownIds = new Set(allFiles.map(f => f.id));
      lastSig = sig;
      firstLoad = false;
    }

    function paint(markNew) {
      const total = allFiles.length;
      countEl.textContent = String(total).padStart(2, '0');
      totalBtn.textContent = total;
      const top = allFiles.slice(0, SHOWN);
      empty.style.display = total ? 'none' : 'flex';
      grid.style.display = total ? 'grid' : 'none';
      grid.innerHTML = '';
      top.forEach(f => grid.appendChild(makeSticker(f, markNew && !knownIds.has(f.id))));
      if (gallery.classList.contains('show')) renderGallery();
    }

    function makeSticker(f, isNew) {
      const card = document.createElement('div');
      card.className = 'sticker' + (isNew ? ' fresh' : '');
      card.innerHTML =
        (isNew ? '<span class="new-flag">Nueva</span>' : '') +
        '<img loading="lazy" src="' + f.thumb + '" onerror="this.onerror=null;this.src=\'' + f.full + '\'" alt="Lámina">';
      card.addEventListener('click', () => openLight(f));
      return card;
    }

    // ---- Lightbox: imprimir + eliminar ----
    let currentFile = null;
    const lightDelete = document.getElementById('lightDelete');
    const lightPrint = document.getElementById('lightPrint');

    function openLight(f) {
      currentFile = f;
      lightImg.src = f.full; printImg.src = f.full;
      lightDelete.disabled = false; lightPrint.disabled = false;
      lightbox.classList.add('show');
    }
    document.getElementById('lightClose').addEventListener('click', () => lightbox.classList.remove('show'));
    lightbox.addEventListener('click', e => { if (e.target === lightbox) lightbox.classList.remove('show'); });
    lightPrint.addEventListener('click', () => {
      if (printImg.complete) window.print();
      else printImg.onload = () => window.print();
    });

    lightDelete.addEventListener('click', async () => {
      if (!currentFile) return;
      if (!confirm('¿Eliminar esta lámina? Se enviará a la papelera de Drive.')) return;
      const f = currentFile;
      lightDelete.disabled = true; lightPrint.disabled = true;
      lightDelete.textContent = 'Eliminando…';
      try {
        const res = await fetch(API_URL, {
          method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ action: 'delete', id: f.id })
        });
        const out = await res.json();
        if (out.status !== 'ok') throw new Error(out.message || 'Error al eliminar');
        allFiles = allFiles.filter(x => x.id !== f.id);
        knownIds.delete(f.id);
        paint();
        lightbox.classList.remove('show');
        showMessage('Lámina eliminada');
      } catch (err) {
        alert('No se pudo eliminar: ' + err.message);
        lightDelete.disabled = false; lightPrint.disabled = false;
      } finally {
        lightDelete.textContent = 'Eliminar';
      }
    });

    // ---- Galería completa (carga imágenes solo al abrir) ----
    document.getElementById('openGallery').addEventListener('click', () => { renderGallery(); gallery.classList.add('show'); });
    document.getElementById('galleryClose').addEventListener('click', () => gallery.classList.remove('show'));
    gallery.addEventListener('click', e => { if (e.target === gallery) gallery.classList.remove('show'); });

    function renderGallery() {
      galleryCount.textContent = allFiles.length;
      galleryGrid.innerHTML = '';
      allFiles.forEach(f => galleryGrid.appendChild(makeSticker(f, false)));
    }

    // ---- Toast ----
    let toastTimer = null;
    function showMessage(text) {
      toast.textContent = text; toast.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove('show'), 3500);
    }
    function showToast(n) {
      showMessage(n === 1 ? 'Nueva lámina recibida' : n + ' láminas nuevas recibidas');
    }

    poll();
    setInterval(poll, REFRESH_SECONDS * 1000);
  </script>
</body>
</html>
