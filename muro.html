<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#F40009" />
  <title>Coca-Cola x Kuva · Muro del evento</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --coke-red: #F40009;
      --coke-red-dark: #C8000A;
      --coke-red-deep: #8B0006;
      --gold: #FFD65A;
      --white: #fff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: 'Poppins', system-ui, sans-serif;
      color: var(--white);
      background:
        radial-gradient(circle at 15% 10%, #ff2a32 0%, transparent 45%),
        radial-gradient(circle at 90% 90%, #ff3b42 0%, transparent 40%),
        linear-gradient(160deg, var(--coke-red) 0%, var(--coke-red-dark) 55%, var(--coke-red-deep) 100%);
      min-height: 100dvh;
      display: flex;
      overflow: hidden;
    }

    /* burbujas */
    .bubbles { position: fixed; inset: 0; overflow: hidden; pointer-events: none; z-index: 0; }
    .bubble { position: absolute; bottom: -80px; border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, rgba(255,255,255,.5), rgba(255,255,255,.05));
      animation: rise linear infinite; }
    @keyframes rise { to { transform: translateY(-115vh); opacity: 0; } }

    /* ===== Sidebar con QR ===== */
    .sidebar {
      position: relative; z-index: 2;
      width: 340px; flex-shrink: 0;
      padding: 34px 26px;
      display: flex; flex-direction: column; align-items: center; text-align: center;
      background: rgba(0,0,0,.16);
      border-right: 1px solid rgba(255,255,255,.18);
      backdrop-filter: blur(6px);
    }
    .brand {
      display: inline-flex; align-items: center; gap: 8px;
      font-weight: 800; font-size: 15px; letter-spacing: .5px;
      background: var(--white); color: var(--coke-red);
      padding: 8px 18px; border-radius: 999px; box-shadow: 0 6px 16px rgba(0,0,0,.25);
    }
    .brand .x { color: #111; opacity: .5; }
    .sidebar h1 { font-size: 26px; font-weight: 800; line-height: 1.15; margin-top: 26px; }
    .sidebar h1 .accent { color: var(--gold); }
    .sidebar .lead { font-size: 15px; opacity: .92; margin-top: 10px; line-height: 1.45; }

    .qr-card {
      margin-top: 26px; background: var(--white); padding: 16px; border-radius: 20px;
      box-shadow: 0 16px 40px rgba(0,0,0,.35); animation: floaty 4s ease-in-out infinite;
    }
    .qr-card img { display: block; width: 240px; height: 240px; border-radius: 8px; }
    @keyframes floaty { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }
    .scan { margin-top: 18px; font-weight: 700; font-size: 18px; }
    .scan small { display: block; font-weight: 400; font-size: 13px; opacity: .85; margin-top: 4px; }

    .counter {
      margin-top: auto; width: 100%;
      background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.25);
      border-radius: 16px; padding: 16px;
    }
    .counter .num { font-size: 44px; font-weight: 800; color: var(--gold); line-height: 1; }
    .counter .lbl { font-size: 13px; opacity: .9; margin-top: 4px; letter-spacing: .5px; }
    .live { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; margin-top: 10px; opacity: .9; }
    .live .dot { width: 9px; height: 9px; border-radius: 50%; background: #3ad06a; box-shadow: 0 0 0 0 rgba(58,208,106,.7); animation: pulse 1.6s infinite; }
    @keyframes pulse { 0%{box-shadow:0 0 0 0 rgba(58,208,106,.6)} 70%{box-shadow:0 0 0 12px rgba(58,208,106,0)} 100%{box-shadow:0 0 0 0 rgba(58,208,106,0)} }

    /* ===== Muro de fotos ===== */
    .wall { position: relative; z-index: 1; flex: 1; padding: 30px; overflow-y: auto; }
    .wall-header { display: flex; align-items: baseline; gap: 12px; margin-bottom: 20px; }
    .wall-header h2 { font-size: 28px; font-weight: 800; text-shadow: 0 2px 8px rgba(0,0,0,.25); }
    .wall-header span { font-size: 15px; opacity: .85; }

    .grid {
      display: grid; gap: 18px;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    }
    .sticker {
      position: relative; border-radius: 14px; overflow: hidden;
      border: 5px solid var(--white); background: #000;
      box-shadow: 0 12px 26px rgba(0,0,0,.35);
      aspect-ratio: 3/4;
      animation: drop .6s cubic-bezier(.2,.9,.3,1.3) both;
    }
    .sticker.fresh { animation: pop-in .9s cubic-bezier(.2,.9,.3,1.4) both; border-color: var(--gold); }
    @keyframes drop { from { opacity: 0; transform: translateY(20px) scale(.96); } }
    @keyframes pop-in { 0% { opacity: 0; transform: scale(.4) rotate(-8deg); }
                        60% { transform: scale(1.06) rotate(2deg); } 100% { transform: scale(1) rotate(0); } }
    .sticker img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .sticker .tag {
      position: absolute; top: 8px; left: 8px;
      background: var(--coke-red); color: #fff; font-size: 11px; font-weight: 700;
      padding: 4px 10px; border-radius: 999px; box-shadow: 0 4px 10px rgba(0,0,0,.3);
    }
    .sticker .new-flag {
      position: absolute; top: 8px; right: 8px;
      background: var(--gold); color: var(--coke-red-deep); font-size: 11px; font-weight: 800;
      padding: 4px 10px; border-radius: 999px;
    }

    .empty { opacity: .85; font-size: 18px; text-align: center; margin-top: 60px; }
    .empty .big { font-size: 54px; margin-bottom: 12px; }

    /* Toast de foto nueva */
    .toast {
      position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%) translateY(120px);
      z-index: 5; background: var(--white); color: var(--coke-red);
      font-weight: 700; font-size: 17px; padding: 14px 26px; border-radius: 999px;
      box-shadow: 0 14px 30px rgba(0,0,0,.35); transition: transform .45s cubic-bezier(.2,.9,.3,1.4);
      display: flex; align-items: center; gap: 10px;
    }
    .toast.show { transform: translateX(-50%) translateY(0); }

    @media (max-width: 820px) {
      body { flex-direction: column; overflow: auto; }
      .sidebar { width: 100%; border-right: none; border-bottom: 1px solid rgba(255,255,255,.18); }
      .counter { margin-top: 22px; }
      .qr-card img { width: 200px; height: 200px; }
      .grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
    }
  </style>
</head>
<body>
  <div class="bubbles" id="bubbles"></div>

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <span class="brand">Coca-Cola <span class="x">×</span> Kuva</span>
    <h1>¡Hazte tu <span class="accent">lámina</span>! ⚽️</h1>
    <p class="lead">Escanea el código, sube tu foto y aparecerás en el muro.</p>

    <div class="qr-card">
      <img id="qr" alt="Código QR para subir tu foto" />
    </div>
    <div class="scan">📲 Escanéame
      <small>y sube tu foto al instante</small>
    </div>

    <div class="counter">
      <div class="num" id="count">0</div>
      <div class="lbl">LÁMINAS SUBIDAS</div>
      <div class="live"><span class="dot"></span> En vivo · se actualiza solo</div>
    </div>
  </aside>

  <!-- MURO -->
  <main class="wall">
    <div class="wall-header">
      <h2>Muro de láminas 🏆</h2>
      <span id="sub">Cargando…</span>
    </div>
    <div class="grid" id="grid"></div>
    <div class="empty" id="empty">
      <div class="big">📸</div>
      Aún no hay fotos. ¡Sé el primero en escanear el QR!
    </div>
  </main>

  <div class="toast" id="toast">🎉 ¡Nueva lámina subida!</div>

  <script>
    // ============================================================
    //  CONFIGURACIÓN
    // ============================================================
    // URL de la landing del usuario (a donde apunta el QR)
    const LANDING_URL = "https://coca-cola-x-kuva.vercel.app";
    // URL del Web App de Apps Script (mismo /exec del uploader)
    const API_URL = "https://script.google.com/macros/s/AKfycbydi_P4E_tQz-SWlr-SS9nKgXiLAMBMc4uXRE7UHrrBvNUfK0uNPVDj1f65_-97RY1HmA/exec";
    // Cada cuántos segundos refresca el muro
    const REFRESH_SECONDS = 5;

    // --- QR (generado con servicio público de imagen) ---
    document.getElementById('qr').src =
      "https://api.qrserver.com/v1/create-qr-code/?size=300x300&margin=8&data=" +
      encodeURIComponent(LANDING_URL);

    // --- Burbujas ---
    (function () {
      const c = document.getElementById('bubbles');
      for (let i = 0; i < 14; i++) {
        const b = document.createElement('span');
        b.className = 'bubble';
        const s = 8 + Math.random() * 30;
        b.style.width = b.style.height = s + 'px';
        b.style.left = Math.random() * 100 + 'vw';
        b.style.animationDuration = (8 + Math.random() * 8) + 's';
        b.style.animationDelay = (-Math.random() * 12) + 's';
        c.appendChild(b);
      }
    })();

    // --- Refs ---
    const grid = document.getElementById('grid');
    const empty = document.getElementById('empty');
    const countEl = document.getElementById('count');
    const subEl = document.getElementById('sub');
    const toast = document.getElementById('toast');

    let knownIds = new Set();
    let firstLoad = true;
    let jsonpSeq = 0;

    // --- Polling por JSONP (evita CORS) ---
    function poll() {
      const cbName = '__muro_cb_' + (jsonpSeq++);
      window[cbName] = function (data) {
        try { render(data); } finally {
          delete window[cbName];
          if (s.parentNode) s.parentNode.removeChild(s);
        }
      };
      const s = document.createElement('script');
      s.src = API_URL + '?action=list&callback=' + cbName + '&t=' + Date.now();
      s.onerror = function () {
        subEl.textContent = 'Reintentando conexión…';
        delete window[cbName];
        if (s.parentNode) s.parentNode.removeChild(s);
      };
      document.body.appendChild(s);
    }

    function render(data) {
      if (!data || data.status !== 'ok') { subEl.textContent = 'Error al cargar'; return; }
      const files = data.files || [];

      countEl.textContent = files.length;
      subEl.textContent = files.length + (files.length === 1 ? ' foto' : ' fotos');
      empty.style.display = files.length ? 'none' : 'block';

      // detectar nuevas
      const incomingIds = new Set(files.map(f => f.id));
      let newCount = 0;

      // reconstruye el grid (más nuevas primero ya vienen ordenadas)
      grid.innerHTML = '';
      files.forEach(f => {
        const isNew = !firstLoad && !knownIds.has(f.id);
        if (isNew) newCount++;

        const card = document.createElement('div');
        card.className = 'sticker' + (isNew ? ' fresh' : '');
        card.innerHTML =
          '<span class="tag">★ KUVA</span>' +
          (isNew ? '<span class="new-flag">NUEVA</span>' : '') +
          '<img loading="lazy" src="' + f.thumb + '" ' +
          'onerror="this.onerror=null;this.src=\'' + f.full + '\'" alt="Lámina">';
        grid.appendChild(card);
      });

      if (newCount > 0) showToast(newCount);

      knownIds = incomingIds;
      firstLoad = false;
    }

    let toastTimer = null;
    function showToast(n) {
      toast.textContent = n === 1 ? '🎉 ¡Nueva lámina subida!' : '🎉 ¡' + n + ' láminas nuevas!';
      toast.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove('show'), 3500);
    }

    // arranque
    poll();
    setInterval(poll, REFRESH_SECONDS * 1000);
  </script>
</body>
</html>
