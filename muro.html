<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#F40009" />
  <title>Coca-Cola · Muro del evento</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&family=Dancing+Script:wght@700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --coke-red: #F40009;
      --coke-red-dark: #C8000A;
      --coke-red-deep: #8B0006;
      --gold: #FFD65A;
      --white: #fff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: 'Poppins', system-ui, sans-serif;
      color: var(--white);
      background:
        radial-gradient(circle at 15% 8%, #ff2a32 0%, transparent 42%),
        radial-gradient(circle at 88% 92%, #ff3b42 0%, transparent 40%),
        linear-gradient(160deg, var(--coke-red) 0%, var(--coke-red-dark) 55%, var(--coke-red-deep) 100%);
      height: 100dvh;
      overflow: hidden;
    }

    /* burbujas */
    .bubbles { position: fixed; inset: 0; overflow: hidden; pointer-events: none; z-index: 0; }
    .bubble { position: absolute; bottom: -80px; border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, rgba(255,255,255,.5), rgba(255,255,255,.05));
      animation: rise linear infinite; }
    @keyframes rise { to { transform: translateY(-115vh); opacity: 0; } }

    /* ===== Contenedor principal (ocupa exactamente la pantalla) ===== */
    .stage {
      position: relative; z-index: 1;
      height: 100dvh; width: 100%;
      display: flex; flex-direction: column;
      padding: clamp(18px, 3vh, 48px) clamp(18px, 3vw, 48px);
      gap: clamp(14px, 2.2vh, 30px);
    }

    /* ===== Header: marca + QR ===== */
    .top {
      display: flex; align-items: center; justify-content: space-between;
      gap: 24px; flex-shrink: 0;
    }
    .brand-block { text-align: left; }
    .wordmark {
      font-family: 'Dancing Script', cursive; font-weight: 700;
      font-size: clamp(44px, 7vh, 92px); line-height: 1;
      text-shadow: 0 4px 14px rgba(0,0,0,.3);
    }
    .ribbon { width: clamp(120px,16vh,200px); height: clamp(7px,1vh,11px); margin-top: 8px;
      background: var(--white); border-radius: 999px; position: relative; }
    .ribbon::before, .ribbon::after { content:""; position:absolute; top:0; width: 22px; height:100%; background: var(--white); }
    .ribbon::before { left:-16px; border-radius:999px 0 0 999px; transform: skewX(-20deg); }
    .ribbon::after { right:-16px; border-radius:0 999px 999px 0; transform: skewX(20deg); }
    .tagline { margin-top: 16px; font-size: clamp(18px, 2.6vh, 34px); font-weight: 700; }
    .tagline small { display:block; font-weight: 400; opacity:.9; font-size: clamp(13px,1.7vh,20px); margin-top: 4px; }

    .qr-block { text-align: center; flex-shrink: 0; }
    .qr-card { background: var(--white); padding: clamp(10px,1.4vh,16px); border-radius: 18px;
      box-shadow: 0 14px 36px rgba(0,0,0,.35); animation: floaty 4s ease-in-out infinite; }
    .qr-card img { display:block; width: clamp(150px, 20vh, 280px); height: clamp(150px, 20vh, 280px); }
    @keyframes floaty { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-7px)} }
    .qr-block .scan { margin-top: 10px; font-weight: 700; font-size: clamp(14px,1.9vh,22px); }

    /* ===== Barra contador + título ===== */
    .bar { display:flex; align-items:center; justify-content:space-between; gap:16px; flex-shrink:0; }
    .bar h2 { font-size: clamp(22px,3vh,40px); font-weight:800; text-shadow:0 2px 8px rgba(0,0,0,.25); }
    .pill { display:flex; align-items:center; gap:10px; background: rgba(255,255,255,.13);
      border:1px solid rgba(255,255,255,.25); border-radius: 999px; padding: 8px 18px; font-size: clamp(14px,1.9vh,22px); font-weight:700; }
    .pill .num { color: var(--gold); }
    .pill .dot { width:10px; height:10px; border-radius:50%; background:#3ad06a; animation:pulse 1.6s infinite; }
    @keyframes pulse { 0%{box-shadow:0 0 0 0 rgba(58,208,106,.6)} 70%{box-shadow:0 0 0 12px rgba(58,208,106,0)} 100%{box-shadow:0 0 0 0 rgba(58,208,106,0)} }

    /* ===== Grid de últimas 8 (llena el espacio restante, sin scroll) ===== */
    .grid {
      flex: 1; min-height: 0;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      grid-template-rows: repeat(4, 1fr);
      gap: clamp(10px, 1.6vh, 22px);
    }
    .sticker {
      position: relative; border-radius: 14px; overflow: hidden;
      border: clamp(3px,.6vh,6px) solid var(--white); background: rgba(0,0,0,.25);
      box-shadow: 0 10px 24px rgba(0,0,0,.32); cursor: pointer;
      animation: drop .6s cubic-bezier(.2,.9,.3,1.3) both;
      transition: transform .15s ease;
    }
    .sticker:active { transform: scale(.97); }
    .sticker.fresh { border-color: var(--gold); animation: pop-in .9s cubic-bezier(.2,.9,.3,1.4) both; }
    @keyframes drop { from { opacity:0; transform: translateY(18px) scale(.96); } }
    @keyframes pop-in { 0%{opacity:0;transform:scale(.4) rotate(-8deg)} 60%{transform:scale(1.05) rotate(2deg)} 100%{transform:scale(1) rotate(0)} }
    .sticker img { width:100%; height:100%; object-fit: cover; display:block; }
    .sticker .tag { position:absolute; top:8px; left:8px; background: var(--coke-red); color:#fff;
      font-size: clamp(9px,1.2vh,13px); font-weight:700; padding:3px 9px; border-radius:999px; box-shadow:0 3px 8px rgba(0,0,0,.3); }
    .sticker .new-flag { position:absolute; top:8px; right:8px; background: var(--gold); color: var(--coke-red-deep);
      font-size: clamp(9px,1.2vh,13px); font-weight:800; padding:3px 9px; border-radius:999px; }

    /* ===== Botón galería ===== */
    .footer-bar { flex-shrink:0; display:flex; justify-content:center; }
    .btn-gallery {
      border:none; cursor:pointer; font-family:inherit; font-weight:700;
      font-size: clamp(15px,2vh,24px); color: var(--coke-red); background: var(--white);
      padding: clamp(12px,1.8vh,20px) clamp(28px,4vw,48px); border-radius: 999px;
      box-shadow: 0 10px 24px rgba(0,0,0,.3); display:inline-flex; align-items:center; gap:10px;
      transition: transform .15s ease;
    }
    .btn-gallery:active { transform: translateY(2px); }

    .empty { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; opacity:.9; text-align:center; }
    .empty .big { font-size: clamp(50px,9vh,90px); margin-bottom: 14px; }
    .empty p { font-size: clamp(16px,2.4vh,28px); }

    /* ===== Modales ===== */
    .overlay {
      position: fixed; inset: 0; z-index: 10; background: rgba(50,0,2,.78);
      backdrop-filter: blur(6px); display:none; align-items:center; justify-content:center; padding: 24px;
    }
    .overlay.show { display:flex; animation: fade .25s ease both; }
    @keyframes fade { from{opacity:0} }

    /* Lightbox (lámina individual) */
    .light-card { width: min(92vw, 620px); max-height: 92dvh; display:flex; flex-direction:column;
      background: var(--white); border-radius: 20px; overflow:hidden; box-shadow: 0 24px 60px rgba(0,0,0,.5);
      animation: pop .35s cubic-bezier(.2,.9,.3,1.4) both; }
    @keyframes pop { from{opacity:0; transform:scale(.85)} }
    .light-card .pic { background:#000; flex:1; min-height:0; display:flex; align-items:center; justify-content:center; }
    .light-card .pic img { width:100%; height:100%; max-height: 64dvh; object-fit: contain; display:block; }
    .light-actions { display:flex; gap:12px; padding:16px; background: var(--white); }
    .light-actions button { flex:1; border:none; cursor:pointer; font-family:inherit; font-weight:700;
      font-size:17px; padding:15px; border-radius:14px; display:inline-flex; align-items:center; justify-content:center; gap:8px; }
    .btn-print { background: var(--coke-red); color:#fff; box-shadow:0 8px 18px rgba(244,0,9,.4); }
    .btn-print:active { transform: translateY(2px); }
    .btn-close { background: #eee; color:#333; flex:0 0 auto; padding-left:22px; padding-right:22px; }

    /* Galería completa */
    .gallery-card { width: min(94vw, 980px); max-height: 92dvh; background: rgba(255,255,255,.08);
      border:1px solid rgba(255,255,255,.25); border-radius: 20px; display:flex; flex-direction:column; overflow:hidden;
      animation: pop .35s cubic-bezier(.2,.9,.3,1.4) both; }
    .gallery-head { display:flex; align-items:center; justify-content:space-between; padding:18px 22px;
      background: rgba(0,0,0,.25); flex-shrink:0; }
    .gallery-head h3 { font-size: 22px; font-weight:800; }
    .gallery-head .close-x { cursor:pointer; background: var(--white); color: var(--coke-red); border:none;
      width:40px; height:40px; border-radius:50%; font-size:22px; font-weight:800; line-height:1; }
    .gallery-grid { overflow-y:auto; padding:20px; display:grid; gap:14px;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
    .gallery-grid .sticker { aspect-ratio: 3/4; animation:none; }

    .toast { position: fixed; bottom: 28px; left:50%; transform: translateX(-50%) translateY(140px); z-index: 20;
      background: var(--white); color: var(--coke-red); font-weight:700; font-size: clamp(15px,2vh,20px);
      padding: 14px 28px; border-radius: 999px; box-shadow:0 14px 30px rgba(0,0,0,.4);
      transition: transform .45s cubic-bezier(.2,.9,.3,1.4); }
    .toast.show { transform: translateX(-50%) translateY(0); }

    /* Área de impresión: oculta en pantalla, visible solo al imprimir */
    #print-area { display:none; }
    @media print {
      body * { visibility: hidden !important; }
      #print-area, #print-area * { visibility: visible !important; }
      #print-area { display:block !important; position: fixed; inset:0; }
      #print-area img { width:100%; height:100%; object-fit: contain; }
      @page { margin: 0; }
    }

    /* Pantallas anchas (no verticales): el QR pasa arriba y el grid se ensancha */
    @media (min-aspect-ratio: 1/1) {
      .grid { grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(2, 1fr); }
    }
  </style>
</head>
<body>
  <div class="bubbles" id="bubbles"></div>

  <div class="stage">
    <!-- HEADER -->
    <header class="top">
      <div class="brand-block">
        <div class="wordmark">Coca-Cola</div>
        <div class="ribbon"></div>
        <div class="tagline">¡Hazte tu lámina! ⚽️
          <small>Escanea, sube tu foto y aparece en el muro.</small>
        </div>
      </div>
      <div class="qr-block">
        <div class="qr-card"><img id="qr" alt="Escanea para subir tu foto" /></div>
        <div class="scan">📲 Escanéame</div>
      </div>
    </header>

    <!-- BARRA -->
    <div class="bar">
      <h2>Últimas láminas 🏆</h2>
      <div class="pill"><span class="dot"></span> <span class="num" id="count">0</span>&nbsp;subidas · en vivo</div>
    </div>

    <!-- GRID 8 -->
    <div class="grid" id="grid"></div>
    <div class="empty" id="empty" style="display:none">
      <div class="big">📸</div>
      <p>Aún no hay fotos.<br>¡Sé el primero en escanear el QR!</p>
    </div>

    <!-- BOTÓN GALERÍA -->
    <div class="footer-bar">
      <button class="btn-gallery" id="openGallery">🖼️ Galería completa (<span id="totalBtn">0</span>)</button>
    </div>
  </div>

  <!-- LIGHTBOX -->
  <div class="overlay" id="lightbox">
    <div class="light-card">
      <div class="pic"><img id="lightImg" alt="Lámina" /></div>
      <div class="light-actions">
        <button class="btn-close" id="lightClose">✕ Cerrar</button>
        <button class="btn-print" id="lightPrint">🖨️ IMPRIMIR</button>
      </div>
    </div>
  </div>

  <!-- GALERÍA COMPLETA -->
  <div class="overlay" id="gallery">
    <div class="gallery-card">
      <div class="gallery-head">
        <h3>Galería completa · <span id="galleryCount">0</span> láminas</h3>
        <button class="close-x" id="galleryClose">✕</button>
      </div>
      <div class="gallery-grid" id="galleryGrid"></div>
    </div>
  </div>

  <div class="toast" id="toast">🎉 ¡Nueva lámina subida!</div>

  <!-- Se rellena al imprimir -->
  <div id="print-area"><img id="printImg" alt="" /></div>

  <script>
    // ============================================================
    //  CONFIGURACIÓN
    // ============================================================
    const LANDING_URL = "https://coca-cola-x-kuva.vercel.app";
    const API_URL = "https://script.google.com/macros/s/AKfycbydi_P4E_tQz-SWlr-SS9nKgXiLAMBMc4uXRE7UHrrBvNUfK0uNPVDj1f65_-97RY1HmA/exec";
    const REFRESH_SECONDS = 5;
    const SHOWN = 8; // cuántas se muestran en el muro principal

    // QR
    document.getElementById('qr').src =
      "https://api.qrserver.com/v1/create-qr-code/?size=320x320&margin=8&data=" + encodeURIComponent(LANDING_URL);

    // Burbujas
    (function () {
      const c = document.getElementById('bubbles');
      for (let i = 0; i < 14; i++) {
        const b = document.createElement('span'); b.className = 'bubble';
        const s = 8 + Math.random() * 30;
        b.style.width = b.style.height = s + 'px';
        b.style.left = Math.random() * 100 + 'vw';
        b.style.animationDuration = (8 + Math.random() * 8) + 's';
        b.style.animationDelay = (-Math.random() * 12) + 's';
        c.appendChild(b);
      }
    })();

    // Refs
    const grid = document.getElementById('grid');
    const empty = document.getElementById('empty');
    const countEl = document.getElementById('count');
    const totalBtn = document.getElementById('totalBtn');
    const toast = document.getElementById('toast');
    const lightbox = document.getElementById('lightbox');
    const lightImg = document.getElementById('lightImg');
    const printImg = document.getElementById('printImg');
    const gallery = document.getElementById('gallery');
    const galleryGrid = document.getElementById('galleryGrid');
    const galleryCount = document.getElementById('galleryCount');

    let allFiles = [];          // metadatos de todas las fotos (ligero)
    let knownIds = new Set();
    let firstLoad = true;
    let seq = 0;

    // ---- Polling JSONP ----
    function poll() {
      const cbName = '__cb_' + (seq++);
      window[cbName] = function (data) {
        try { onData(data); } finally { cleanup(); }
      };
      const s = document.createElement('script');
      function cleanup(){ delete window[cbName]; if (s.parentNode) s.parentNode.removeChild(s); }
      s.onerror = cleanup;
      s.src = API_URL + '?action=list&callback=' + cbName + '&t=' + Date.now();
      document.body.appendChild(s);
    }

    function onData(data) {
      if (!data || data.status !== 'ok') return;
      allFiles = data.files || [];
      const total = allFiles.length;

      countEl.textContent = total;
      totalBtn.textContent = total;

      // detectar nuevas
      const incoming = new Set(allFiles.map(f => f.id));
      let newCount = 0;
      if (!firstLoad) allFiles.forEach(f => { if (!knownIds.has(f.id)) newCount++; });

      // muro principal: solo las últimas SHOWN
      const top = allFiles.slice(0, SHOWN);
      empty.style.display = total ? 'none' : 'flex';
      grid.style.display = total ? 'grid' : 'none';
      grid.innerHTML = '';
      top.forEach(f => grid.appendChild(makeSticker(f, !firstLoad && !knownIds.has(f.id))));

      // si la galería está abierta, refrescarla también
      if (gallery.classList.contains('show')) renderGallery();

      if (newCount > 0) showToast(newCount);
      knownIds = incoming;
      firstLoad = false;
    }

    function makeSticker(f, isNew) {
      const card = document.createElement('div');
      card.className = 'sticker' + (isNew ? ' fresh' : '');
      card.innerHTML =
        '<span class="tag">★ COCA-COLA</span>' +
        (isNew ? '<span class="new-flag">NUEVA</span>' : '') +
        '<img loading="lazy" src="' + f.thumb + '" onerror="this.onerror=null;this.src=\'' + f.full + '\'" alt="Lámina">';
      card.addEventListener('click', () => openLight(f));
      return card;
    }

    // ---- Lightbox + impresión ----
    function openLight(f) {
      lightImg.src = f.full;
      printImg.src = f.full;
      lightbox.classList.add('show');
    }
    document.getElementById('lightClose').addEventListener('click', () => lightbox.classList.remove('show'));
    lightbox.addEventListener('click', e => { if (e.target === lightbox) lightbox.classList.remove('show'); });
    document.getElementById('lightPrint').addEventListener('click', () => {
      // espera a que la imagen de impresión esté lista, luego imprime
      if (printImg.complete) window.print();
      else printImg.onload = () => window.print();
    });

    // ---- Galería completa (carga todas las imágenes solo al abrir) ----
    document.getElementById('openGallery').addEventListener('click', () => {
      renderGallery();
      gallery.classList.add('show');
    });
    document.getElementById('galleryClose').addEventListener('click', () => gallery.classList.remove('show'));
    gallery.addEventListener('click', e => { if (e.target === gallery) gallery.classList.remove('show'); });

    function renderGallery() {
      galleryCount.textContent = allFiles.length;
      galleryGrid.innerHTML = '';
      allFiles.forEach(f => galleryGrid.appendChild(makeSticker(f, false)));
    }

    // ---- Toast ----
    let toastTimer = null;
    function showToast(n) {
      toast.textContent = n === 1 ? '🎉 ¡Nueva lámina subida!' : '🎉 ¡' + n + ' láminas nuevas!';
      toast.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove('show'), 3500);
    }

    // arranque
    poll();
    setInterval(poll, REFRESH_SECONDS * 1000);
  </script>
</body>
</html>
